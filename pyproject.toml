[project]
name = "location-encoder"
version = "0.1.0"
description = "Location encoder"
readme = "README.md"
authors = [
    { name = "tlidzhiev", email = "trlidzhiev@gmail.com" }
]
requires-python = "==3.15.2"
dependencies = [
    "comet-ml==3.58.10",
    "datasets==5.1.0",
    "hydra-core==1.3.8",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "safetensors==0.8.0",
    "sentence-transformers==6.2.0",
    "torch==2.15.0",
    "torchmetrics==1.9.0",
    "torchvision==0.29.2",
    "tqdm==4.70.1",
    "transformers==5.22.1",
]

[dependency-groups]
download = [
    "geopandas==1.2.0",
    "osmnx==2.1.1",
    "overturemaps==1.0.2",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "rapidfuzz==3.14.6",
    "shapely==2.2.0",
]
dev = [
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
    "jupyter==1.1.1",
    "pre-commit==4.7.0",
    "ruff==0.17.4",
    "ty==0.0.99",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lab"

[project.scripts]
train = "lab.train:main"
inference = "lab.inference:main"

[tool.ruff.format]
quote-style = "single"

[tool.ruff]
line-length = 100

[[tool.ty.overrides]]
include = ["src/lab/model/**", "src/lab/loss/**"]

[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"
