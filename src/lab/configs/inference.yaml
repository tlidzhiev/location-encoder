hydra:
  run:
    dir: data/saved/${inferencer.save_path}

defaults:
  - _self_
  - dataset: london_val
  - dataloader: default
  - transforms: default
  - model: calliper
  - metrics: default

inferencer:
  device_tensors: ["coords", "text_emb", "text_id"]
  device: "auto"  # device name or "auto"
  amp: null  # null (full precision) or "bfloat16"
  compile: null  # null (eager) or torch.compile kwargs, e.g. {mode: default, fullgraph: false}
  seed: 42
  from_pretrained: null  # path to the model checkpoint (*.pth file)
  use_ema: true  # load EMA (shadow) weights from checkpoint instead of raw weights
  save_path: "default"  # predictions saved to data/saved/{save_path}/{partition}/
